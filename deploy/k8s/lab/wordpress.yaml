apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: veto-lab
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: veto_root_change_me
  MYSQL_PASSWORD: veto_lab_change_me
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: veto-alb-identity
  namespace: veto-lab
data:
  veto-alb-identity.php: |
    <?php
    /**
     * Plugin Name: VETO ALB Identity
     * Description: Footer shows node IP + pod name for ALB demo.
     */
    add_action('wp_footer', function () {
        $node = getenv('NODE_IP') ?: 'unknown-node';
        $name = getenv('NODE_NAME') ?: 'unknown-node-name';
        $pod  = gethostname();
        echo '<p class="veto-alb-identity" style="text-align:center;font-size:12px;opacity:.75;margin:1rem 0;">'
            . 'Served by: ' . esc_html($node)
            . ' (' . esc_html($name) . ')'
            . ' | pod: ' . esc_html($pod)
            . '</p>';
    }, 99);
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: veto-lab
spec:
  ports:
    - port: 3306
  selector:
    app: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: veto-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_DATABASE
              value: wordpress
            - name: MYSQL_USER
              value: veto
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          hostPath:
            path: /mnt/efs/mysql
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: veto-lab
spec:
  ports:
    - port: 80
  selector:
    app: wordpress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: veto-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: wordpress
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: seed-mu-plugin
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /wp/mu-plugins && cp /plugin/veto-alb-identity.php /wp/mu-plugins/
          volumeMounts:
            - name: wp-content
              mountPath: /wp
            - name: mu-plugin
              mountPath: /plugin
      containers:
        - name: wordpress
          image: wordpress:6.8-php8.2-apache
          env:
            - name: WORDPRESS_DB_HOST
              value: mysql
            - name: WORDPRESS_DB_USER
              value: veto
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
            - name: WORDPRESS_DB_NAME
              value: wordpress
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content
      volumes:
        - name: wp-content
          hostPath:
            path: /mnt/efs/wordpress
            type: DirectoryOrCreate
        - name: mu-plugin
          configMap:
            name: veto-alb-identity
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress
  namespace: veto-lab
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port:
                  number: 80
