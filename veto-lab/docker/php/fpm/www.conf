[www]
; php-fpm clears the environment by default, which would hide WP_URL and the
; DB credentials from wp-config.php.
clear_env = no

pm = dynamic
; ~40 workers x ~80 MB fits comfortably in the 6 GiB limit set for this service.
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
pm.process_idle_timeout = 30s

pm.status_path = /status
ping.path = /ping
ping.response = pong

catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d ms %{kilo}M kB"

request_terminate_timeout = 300s
request_slowlog_timeout = 15s
slowlog = /proc/self/fd/2
