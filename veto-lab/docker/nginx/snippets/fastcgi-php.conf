include fastcgi_params;

fastcgi_split_path_info ^(.+\.php)(/.+)$;
fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
fastcgi_param PATH_INFO $fastcgi_path_info;

# Set (not forwarded) by us, so a client cannot spoof HTTPS detection in
# wp-config.php by sending its own X-Forwarded-* headers.
fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
# $http_host, not $host: it keeps the port, which local development needs
# (http://localhost:8080) and which $host would silently drop.
fastcgi_param HTTP_X_FORWARDED_HOST $http_host;

# Re-resolve on each request so a WordPress container restart cannot 502
# the site (nginx otherwise caches the old Docker IP until nginx restarts).
resolver 127.0.0.11 valid=10s ipv6=off;
set $wp_upstream wordpress:9000;
fastcgi_pass $wp_upstream;
fastcgi_index index.php;
fastcgi_intercept_errors off;
fastcgi_hide_header X-Powered-By;

fastcgi_buffer_size 32k;
fastcgi_buffers 16 16k;
fastcgi_busy_buffers_size 64k;
fastcgi_read_timeout 300s;
