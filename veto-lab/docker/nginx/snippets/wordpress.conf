# Shared WordPress location rules (included from local + prod server blocks).

root /var/www/html;
index index.php index.html;

location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
}

location = /favicon.ico {
    log_not_found off;
    access_log off;
}

location = /robots.txt {
    log_not_found off;
    access_log off;
    try_files $uri /index.php$is_args$args;
}

# Brute-force protection on the two endpoints that get hammered.
location = /wp-login.php {
    limit_req zone=wplogin burst=5 nodelay;
    try_files $uri =404;
    include /etc/nginx/snippets/fastcgi-php.conf;
}

location = /xmlrpc.php {
    # Nothing on this site uses XML-RPC; it is a constant brute-force target.
    deny all;
    access_log off;
}

location ^~ /wp-admin/admin-ajax.php {
    limit_req zone=wpadmin burst=20 nodelay;
    try_files $uri =404;
    include /etc/nginx/snippets/fastcgi-php.conf;
}

# install.php is deliberately NOT blocked: it is needed for the first-run setup,
# and WordPress redirects it away once the site exists.
location ~* ^/(?:wp-config\.php|wp-config-sample\.php|readme\.html|license\.txt) {
    deny all;
}

# An upload that somehow ends in .php must never be executed.
location ~* ^/wp-content/(?:uploads|upgrade)/.*\.(?:php[0-9]?|phtml|phar)$ {
    deny all;
}

location ~* ^/wp-content/.*\.(?:sql|log|bak|swp|sh|ini|conf)$ {
    deny all;
}

# Dotfiles, except the ACME challenge directory.
location ~ /\.(?!well-known/) {
    deny all;
    access_log off;
    log_not_found off;
}

location ~* \.(?:css|js|mjs|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|otf|eot|mp4|webm|ogg|pdf|zip)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.php$is_args$args;
}

location ~ \.php$ {
    try_files $uri =404;
    include /etc/nginx/snippets/fastcgi-php.conf;

    # Full-page cache for anonymous browsing (shop/home/product HTML).
    fastcgi_cache WORDPRESS;
    fastcgi_cache_valid 200 301 302 10m;
    fastcgi_cache_valid 404 1m;
    fastcgi_cache_bypass $wp_skip_cache;
    fastcgi_no_cache $wp_skip_cache;
    fastcgi_cache_use_stale error timeout updating http_500 http_503;
    fastcgi_cache_background_update on;
    fastcgi_cache_lock on;
}
