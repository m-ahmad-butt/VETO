stages:
  - deploy

variables:
  DEPLOY_DIR: "/opt/veto-lab"

.deploy_rules: &deploy_rules
  tags:
    - veto-lab-aws
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

deploy_production:
  stage: deploy
  <<: *deploy_rules
  script:
    - |
      if [ -z "${PROD_ENV:-}" ]; then
        echo "Missing CI variable PROD_ENV (Type: File). Add it under Settings → CI/CD → Variables."
        exit 1
      fi
    - sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq unzip curl ca-certificates
    - sudo mkdir -p "$DEPLOY_DIR"
    - sudo chown gitlab-runner:gitlab-runner "$DEPLOY_DIR"
    - |
      if [ -d "$DEPLOY_DIR/original/wp-content" ]; then
        sudo chown -R gitlab-runner:gitlab-runner "$DEPLOY_DIR/original/wp-content" || true
      fi
      if [ -d "$DEPLOY_DIR/decoy/wp-content" ]; then
        sudo chown -R gitlab-runner:gitlab-runner "$DEPLOY_DIR/decoy/wp-content" || true
      fi
    - |
      rsync -a --delete \
        --exclude '.env' \
        --exclude '.git' \
        --exclude 'logs/' \
        --exclude 'original/wp-content/uploads/' \
        --exclude 'original/wp-content/cache/' \
        --exclude 'original/wp-content/upgrade/' \
        --exclude 'original/wp-content/upgrade-temp-backup/' \
        --exclude 'decoy/wp-content/uploads/' \
        --exclude 'decoy/wp-content/cache/' \
        --exclude 'decoy/wp-content/upgrade/' \
        --exclude 'decoy/wp-content/upgrade-temp-backup/' \
        ./ "$DEPLOY_DIR/"
    - |
      if [ -e "$DEPLOY_DIR/.env" ]; then
        sudo chown gitlab-runner:gitlab-runner "$DEPLOY_DIR/.env"
        chmod u+rw "$DEPLOY_DIR/.env" || true
      fi
      cp "$PROD_ENV" "$DEPLOY_DIR/.env"
      bash "$DEPLOY_DIR/scripts/overlay-env-from-ci.sh" "$DEPLOY_DIR/.env" \
        || bash scripts/overlay-env-from-ci.sh "$DEPLOY_DIR/.env" \
        || echo "overlay-env-from-ci skipped"
      chmod 640 "$DEPLOY_DIR/.env"
      sudo chown gitlab-runner:ubuntu "$DEPLOY_DIR/.env" || sudo chown gitlab-runner:gitlab-runner "$DEPLOY_DIR/.env"
    - cd "$DEPLOY_DIR"
    - chmod +x scripts/*.sh || true
    - sudo chown -R 33:33 "$DEPLOY_DIR/original/wp-content" "$DEPLOY_DIR/decoy/wp-content"
    - docker compose -f docker-compose-prod.yml up -d --build
    - docker compose -f docker-compose-prod.yml ps
