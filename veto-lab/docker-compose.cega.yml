name: veto-cega-api

x-cega-root: &cega-root ../../cega-webb/web

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=authdb
    volumes:
      - cega_mongo_data:/data/db
    networks:
      - cega
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)\" || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 40s

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: ["redis-server", "--requirepass", "123123123"]
    volumes:
      - cega_redis_data:/data
    networks:
      - cega
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123123123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin123
      RABBITMQ_DEFAULT_PASS: "123123123"
      RABBITMQ_DEFAULT_VHOST: hackathon
    volumes:
      - cega_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - cega
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent:
    profiles: ["agent"]
    build:
      context: ../../cega-webb/web/agent
      dockerfile: Dockerfile
    image: examslot-agent:veto
    ports:
      - "8002:8002"
    env_file:
      - ../../cega-webb/web/agent/.env
    environment:
      REDIS_URL: redis://:123123123@redis:6379
    networks:
      - cega
    depends_on:
      redis:
        condition: service_healthy

  backend:
    build:
      context: ../../cega-webb/web/backend
      dockerfile: Dockerfile.dev
    image: hackathon-backend:veto
    ports:
      - "3001:3001"
    env_file:
      - ../../cega-webb/web/backend/.env
    environment:
      NODE_ENV: development
      AGENT_URL: http://agent:8002
      AGENT_SECRET: examslot-agent-secret
      MONGO_URI: mongodb://mongodb:27017/authdb
      REDIS_URL: redis://:123123123@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "123123123"
      FRONTEND_URL: http://localhost:8080
    volumes:
      - ../../cega-webb/web/backend:/app
      - cega_backend_node_modules:/app/node_modules
    command: npm run dev
    networks:
      - cega
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

networks:
  cega:
    driver: bridge

volumes:
  cega_mongo_data:
  cega_redis_data:
  cega_rabbitmq_data:
  cega_backend_node_modules:
