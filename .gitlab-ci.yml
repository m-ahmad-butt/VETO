stages:
  - build
  - test
  - terraform
  - configure
  - deploy_stage
  - deploy_prod

variables:
  DEPLOY_DIR: "/opt/veto-lab"
  TF_ROOT: "infra/terraform"
  AWS_DEFAULT_REGION: "ap-south-1"

.on_main_or_mr: &on_main_or_mr
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.on_main_auto: &on_main_auto
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.on_main_manual: &on_main_manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

build_lab:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  <<: *on_main_or_mr
  script:
    - apk add --no-cache bash
    - docker info
    - bash scripts/ci/build-lab.sh

test_lab:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  <<: *on_main_or_mr
  needs:
    - job: build_lab
      optional: true
  script:
    - apk add --no-cache bash
    - bash scripts/ci/test-lab.sh

terraform_plan:
  stage: terraform
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  <<: *on_main_manual
  script:
    - terraform -chdir="$TF_ROOT" init -input=false
    - terraform -chdir="$TF_ROOT" plan -input=false -out=tfplan
  artifacts:
    paths:
      - infra/terraform/tfplan
    expire_in: 1 day

terraform_apply:
  stage: terraform
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  <<: *on_main_manual
  needs:
    - job: terraform_plan
      artifacts: true
  script:
    - terraform -chdir="$TF_ROOT" init -input=false
    - terraform -chdir="$TF_ROOT" apply -input=false -auto-approve tfplan
  artifacts:
    reports:
      dotenv: infra/terraform/tf_outputs.env
    paths:
      - infra/terraform/tf_outputs.env
    expire_in: 7 days
    when: always
  after_script:
    - |
      {
        echo "STAGE_IP=$(terraform -chdir=$TF_ROOT output -raw stage_ip 2>/dev/null || true)"
        echo "PROD_IP=$(terraform -chdir=$TF_ROOT output -raw prod_ip 2>/dev/null || true)"
      } > infra/terraform/tf_outputs.env || true

ansible_configure_stage:
  stage: configure
  image: cytopia/ansible:latest
  <<: *on_main_manual
  needs:
    - job: terraform_apply
      optional: true
      artifacts: true
  variables:
    TARGET_ENV: stage
  script:
    - |
      if [ -z "${ANSIBLE_SSH_KEY:-}" ] && [ -n "${SSH_PRIVATE_KEY_FILE:-}" ]; then
        export ANSIBLE_SSH_KEY="$SSH_PRIVATE_KEY_FILE"
      fi
      if [ -n "${ANSIBLE_SSH_KEY:-}" ] && [ ! -f "${ANSIBLE_SSH_KEY}" ]; then
        KEYFILE="$(mktemp)"
        printf '%s\n' "$ANSIBLE_SSH_KEY" > "$KEYFILE"
        chmod 600 "$KEYFILE"
        export ANSIBLE_SSH_KEY="$KEYFILE"
      fi
      bash scripts/ci/ansible-configure.sh

ansible_configure_prod:
  stage: configure
  image: cytopia/ansible:latest
  <<: *on_main_manual
  needs:
    - job: terraform_apply
      optional: true
      artifacts: true
  variables:
    TARGET_ENV: prod
  script:
    - |
      if [ -z "${ANSIBLE_SSH_KEY:-}" ] && [ -n "${SSH_PRIVATE_KEY_FILE:-}" ]; then
        export ANSIBLE_SSH_KEY="$SSH_PRIVATE_KEY_FILE"
      fi
      if [ -n "${ANSIBLE_SSH_KEY:-}" ] && [ ! -f "${ANSIBLE_SSH_KEY}" ]; then
        KEYFILE="$(mktemp)"
        printf '%s\n' "$ANSIBLE_SSH_KEY" > "$KEYFILE"
        chmod 600 "$KEYFILE"
        export ANSIBLE_SSH_KEY="$KEYFILE"
      fi
      bash scripts/ci/ansible-configure.sh

deploy_stage:
  stage: deploy_stage
  tags:
    - veto-lab-stage
  <<: *on_main_auto
  needs:
    - job: test_lab
  script:
    - bash scripts/ci/deploy-lab.sh

deploy_prod:
  stage: deploy_prod
  tags:
    - veto-lab-prod
  <<: *on_main_manual
  needs:
    - job: deploy_stage
  script:
    - bash scripts/ci/deploy-lab.sh
