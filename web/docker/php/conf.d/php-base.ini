; Applied in every environment. Environment-specific files (zz-dev.ini /
; zz-prod.ini) are mounted on top and win, because conf.d is read in order.

memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

upload_max_filesize = 256M
post_max_size = 256M

expose_php = Off
date.timezone = UTC

; WordPress writes to the session-less request cycle; keep the file cache small.
realpath_cache_size = 4096k
realpath_cache_ttl = 600
