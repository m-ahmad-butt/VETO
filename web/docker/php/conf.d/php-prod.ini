display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
; Timestamps stay validated: plugin/theme updates from wp-admin land in the
; wp-content bind mount and must take effect without restarting the container.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
; PHP 8.3 JIT tracing can corrupt hot paths in wp-includes/theme.php and
; request a bogus ~4GB allocation (4295229440). Keep OPcache; disable JIT.
opcache.jit = disable
opcache.jit_buffer_size = 0
