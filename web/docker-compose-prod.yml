name: veto-lab

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  original-db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --skip-name-resolve
    environment:
      MYSQL_DATABASE: ${ORIGINAL_DB_NAME:-veto_original}
      MYSQL_USER: ${MYSQL_USER:-veto}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      TZ: ${TZ:-UTC}
    volumes:
      - original_db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - veto
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536m

  decoy-db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --skip-name-resolve
    environment:
      MYSQL_DATABASE: ${DECOY_DB_NAME:-veto_decoy}
      MYSQL_USER: ${MYSQL_USER:-veto}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      TZ: ${TZ:-UTC}
    volumes:
      - decoy_db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - veto
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536m

  original-wordpress:
    image: ${WORDPRESS_IMAGE:-wordpress:6.8-php8.2-apache}
    restart: unless-stopped
    depends_on:
      original-db:
        condition: service_healthy
    ports:
      - "${ORIGINAL_HTTP_PORT:-80}:80"
    environment:
      WORDPRESS_DB_HOST: original-db:3306
      WORDPRESS_DB_NAME: ${ORIGINAL_DB_NAME:-veto_original}
      WORDPRESS_DB_USER: ${MYSQL_USER:-veto}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-0}
      WORDPRESS_CONFIG_EXTRA: |
        if (getenv('ORIGINAL_URL')) {
            define('WP_HOME', rtrim(getenv('ORIGINAL_URL'), '/'));
            define('WP_SITEURL', rtrim(getenv('ORIGINAL_URL'), '/'));
        }
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
        define('FS_METHOD', 'direct');
        define('DISALLOW_FILE_EDIT', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('WP_MEMORY_LIMIT', '512M');
        define('WP_MAX_MEMORY_LIMIT', '512M');
        define('VETO_SITE_ROLE', 'original');
        define('WP_ENV', getenv('WP_ENV') ?: 'production');
      ORIGINAL_URL: ${ORIGINAL_URL:?set ORIGINAL_URL in .env}
      WP_ENV: ${WP_ENV:-production}
      TZ: ${TZ:-UTC}
    volumes:
      - original_wp_data:/var/www/html
      - ./original/wp-content:/var/www/html/wp-content
    networks:
      - veto
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536m

  decoy-wordpress:
    image: ${WORDPRESS_IMAGE:-wordpress:6.8-php8.2-apache}
    restart: unless-stopped
    depends_on:
      decoy-db:
        condition: service_healthy
    ports:
      - "${DECOY_HTTP_PORT:-8082}:80"
    environment:
      WORDPRESS_DB_HOST: decoy-db:3306
      WORDPRESS_DB_NAME: ${DECOY_DB_NAME:-veto_decoy}
      WORDPRESS_DB_USER: ${MYSQL_USER:-veto}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-0}
      WORDPRESS_CONFIG_EXTRA: |
        if (getenv('DECOY_URL')) {
            define('WP_HOME', rtrim(getenv('DECOY_URL'), '/'));
            define('WP_SITEURL', rtrim(getenv('DECOY_URL'), '/'));
        }
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
        define('FS_METHOD', 'direct');
        define('DISALLOW_FILE_EDIT', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('WP_MEMORY_LIMIT', '512M');
        define('WP_MAX_MEMORY_LIMIT', '512M');
        define('VETO_SITE_ROLE', 'decoy');
        define('WP_ENV', getenv('WP_ENV') ?: 'production');
      DECOY_URL: ${DECOY_URL:?set DECOY_URL in .env}
      WP_ENV: ${WP_ENV:-production}
      TZ: ${TZ:-UTC}
    volumes:
      - decoy_wp_data:/var/www/html
      - ./decoy/wp-content:/var/www/html/wp-content
    networks:
      - veto
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536m

  original-wpcli:
    image: wordpress:cli-php8.3
    profiles: ["setup"]
    depends_on:
      original-wordpress:
        condition: service_started
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: original-db:3306
      WORDPRESS_DB_NAME: ${ORIGINAL_DB_NAME:-veto_original}
      WORDPRESS_DB_USER: ${MYSQL_USER:-veto}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      HOME: /tmp
    volumes:
      - original_wp_data:/var/www/html
      - ./original/wp-content:/var/www/html/wp-content
      - ./scripts:/scripts:ro
    networks:
      - veto
    entrypoint: ["bash", "/scripts/bootstrap-site.sh"]
    command:
      - original
      - ${ORIGINAL_URL:?set ORIGINAL_URL in .env}
      - ${WP_ADMIN_USER:-ahmad}
      - ${WP_ADMIN_PASSWORD:?set WP_ADMIN_PASSWORD in .env}
      - ${WP_ADMIN_EMAIL:-ahmad@veto-lab.local}

  decoy-wpcli:
    image: wordpress:cli-php8.3
    profiles: ["setup"]
    depends_on:
      decoy-wordpress:
        condition: service_started
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: decoy-db:3306
      WORDPRESS_DB_NAME: ${DECOY_DB_NAME:-veto_decoy}
      WORDPRESS_DB_USER: ${MYSQL_USER:-veto}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      HOME: /tmp
    volumes:
      - decoy_wp_data:/var/www/html
      - ./decoy/wp-content:/var/www/html/wp-content
      - ./scripts:/scripts:ro
    networks:
      - veto
    entrypoint: ["bash", "/scripts/bootstrap-site.sh"]
    command:
      - decoy
      - ${DECOY_URL:?set DECOY_URL in .env}
      - ${WP_ADMIN_USER:-ahmad}
      - ${WP_ADMIN_PASSWORD:?set WP_ADMIN_PASSWORD in .env}
      - ${WP_ADMIN_EMAIL:-ahmad@veto-lab.local}

volumes:
  original_db_data:
  decoy_db_data:
  original_wp_data:
  decoy_wp_data:

networks:
  veto:
    driver: bridge
